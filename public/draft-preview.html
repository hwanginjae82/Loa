<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>저장 방식 미리보기</title>
    <style>
      :root { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #172018; background: #f3f5f0; }
      body { margin: 0; padding: 32px 18px; }
      main { width: min(680px, 100%); margin: 0 auto; }
      header, section { border: 1px solid #c8d0c5; background: white; }
      header { padding: 22px; border-top: 6px solid #c6a322; }
      h1 { margin: 0; font-size: 24px; } p { color: #617060; line-height: 1.55; }
      section { margin-top: 16px; padding: 20px; }
      .state { display: inline-block; padding: 5px 9px; border-radius: 999px; background: #eaf4e7; color: #37613c; font-size: 13px; font-weight: 800; }
      .state.dirty { background: #fff0cf; color: #825800; }
      .raid { display: grid; gap: 10px; margin: 18px 0; padding: 16px; border-left: 5px solid #0f9dd2; background: #f7faf6; }
      .raid strong { font-size: 18px; } .raid span { font-size: 15px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button { padding: 10px 14px; border: 1px solid #aeb9aa; border-radius: 5px; background: white; color: #2b382b; font: inherit; font-weight: 800; cursor: pointer; }
      #save { border-color: #172018; background: #172018; color: white; } #save:disabled { opacity: .42; cursor: default; }
      #cancel:disabled { opacity: .42; cursor: default; }
      .hint { margin: 14px 0 0; font-size: 13px; color: #6a7468; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>수정 후 저장 방식</h1>
        <p>이 화면은 동작 방식만 보여주는 안전한 미리보기입니다. 실제 일정이나 공용 DB에는 연결되지 않습니다.</p>
      </header>
      <section>
        <span id="state" class="state">저장된 상태</span>
        <div class="raid">
          <strong>종막 하드</strong>
          <span id="member">1파티 서폿 · 모카민트쉐이크</span>
        </div>
        <div class="actions">
          <button id="edit" type="button">수정해 보기</button>
          <button id="cancel" type="button" disabled>취소</button>
          <button id="save" type="button" disabled>저장</button>
        </div>
        <p id="hint" class="hint">수정해 보기를 누르면 변경 내용은 이 화면에만 남습니다.</p>
      </section>
    </main>
    <script type="module">
      import { beginDraft, cancelDraft, saveDraft, updateDraft } from "/src/draftSession.js";

      let session = beginDraft({ member: "모카민트쉐이크" });
      const state = document.querySelector("#state");
      const member = document.querySelector("#member");
      const save = document.querySelector("#save");
      const cancel = document.querySelector("#cancel");
      const hint = document.querySelector("#hint");

      const render = () => {
        const changed = session.isDirty;
        state.textContent = changed ? "저장하지 않은 수정 있음" : "저장된 상태";
        state.classList.toggle("dirty", changed);
        member.textContent = `1파티 서폿 · ${session.draft.member}`;
        save.disabled = !changed;
        cancel.disabled = !changed;
        hint.textContent = changed
          ? "저장을 눌러야만 공용 일정에 반영됩니다. 취소하면 마지막 저장 상태로 돌아갑니다."
          : "수정해 보기를 누르면 변경 내용은 이 화면에만 남습니다.";
      };

      document.querySelector("#edit").addEventListener("click", () => {
        session = updateDraft(session, { member: "스카치멜로우" });
        render();
      });
      cancel.addEventListener("click", () => { session = cancelDraft(session); render(); });
      save.addEventListener("click", () => { session = saveDraft(session); render(); });
      render();
    </script>
  </body>
</html>
